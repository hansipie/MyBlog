baseURL = "https://blog.ansicode.fr/"
title = "ansicode"
languageCode = "fr"
defaultContentLanguage = "fr"
theme = "hansilanding"
summaryLength = 42
enableEmoji = false
enableRobotsTXT = true
disablePathToLower = false
relativeURLs = false
uglyURLs = false

[pagination]
  pagerSize = 9

[permalinks]
  categories = "/categories/:slug/"
  tags = "/tags/:slug/"

[menu]
  [[menu.main]]
    pageref = "/posts/"
    name = "Posts"
    weight = 1
  [[menu.main]]
    pageref = "/labs/"
    name = "Labs"
    weight = 2
  [[menu.main]]
    pageref = "/categories/"
    name = "Catégories"
    weight = 3
  [[menu.main]]
    pageref = "/tags/"
    name = "Tags"
    weight = 4
  [[menu.main]]
    pageref = "/about/"
    name = "À propos"
    weight = 5

[taxonomies]
  category = "categories"
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  description = " "
  brandName = "ansicode"
  status = "Open to targeted missions"
  region = "France, remote friendly"
  faviconSmall = "/favicon-32.png"
  faviconLarge = "/hansi-icon.png"
  footerBio = "Ingénieur logiciel senior, Tech Lead et architecte opérationnel, spécialisé en C/C++, systèmes, réseau, Developer Tools et IA appliquée."

  [params.author]
    name = "Hansi PIERRE"
    initials = "HP"
    email = "ansicode@ansicode.fr"
    photo = "/hansi-profile.png"
    github = "hansipie"
    linkedin = "hansi-pierre-05582b1b2"
    twitter = "ansi__code"

  [params.footerCredit]
    label = "Design inspiré par ankoay.dev"
    url = "https://ankoay.dev/"
